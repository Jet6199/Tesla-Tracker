name: Tesla Watch

on:
  # Every 15 minutes, offset from the quarter-hour marks. GitHub queues
  # scheduled workflows globally and the round numbers are the most congested
  # slots, so an odd offset reduces how late runs start.
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: tesla-watch
  cancel-in-progress: false

# Needed so the job can commit the updated state file back to the repo.
permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Action versions below are the Node 24 majors. Node 20 is removed from
      # GitHub runners on 2026-09-16, after which older majors stop working.
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run watcher
        env:
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
          TESLA_REFERENCE_NUMBER: ${{ secrets.TESLA_REFERENCE_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: python tesla_watch.py

      # State is committed rather than cached. Caching state is unreliable
      # because cache entries are immutable and evictable; a commit always
      # persists. Order details are stored as digests, so nothing personal is
      # published. Inventory entries are public listings either way.
      - name: Commit state if changed
        if: always()
        run: |
          if [[ -z "$(git status --porcelain tesla_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "tesla-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tesla_state.json
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed while this one was working.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
