name: Tesla Watch

on:
  # Every 15 minutes, offset from the quarter-hour marks. GitHub queues
  # scheduled workflows globally and the round numbers are the most congested
  # slots, so an odd offset measurably reduces how late runs start.
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: tesla-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      # State lives in the Actions cache rather than in a commit, so the repo
      # can be public (for unmetered minutes) without publishing your VIN.
      # Cache entries are immutable: each run saves a unique key and restores
      # the most recent one by prefix.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: tesla_state.json
          key: tesla-state-${{ github.run_id }}
          restore-keys: |
            tesla-state-

      - name: Run watcher
        env:
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
          TESLA_REFERENCE_NUMBER: ${{ secrets.TESLA_REFERENCE_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: python tesla_watch.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tesla_state.json
          key: tesla-state-${{ github.run_id }}
